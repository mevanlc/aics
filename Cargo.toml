[package]
name = "aics"
version = "0.1.0"
edition = "2021"

[features]
default = ["arboard"]
termux = []
arboard = ["dep:arboard"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
env_logger = "0.11"
log = "0.4"
pulldown-cmark = "0.13.0"
ratatui = "0.30.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = "5.3.0"
tantivy = "0.25.0"
tui-input = "0.15.0"
unicode-segmentation = "1.12.0"
unicode-truncate = "2.0.1"
unicode-width = "0.2.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6.1", optional = true }

[dev-dependencies]
tempfile = "3.15"
