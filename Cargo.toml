[package]
name = "aics"
version = "0.0.0"
edition = "2021"

[features]
default = ["arboard"]
termux = []
arboard = ["dep:arboard"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.5"
crossterm = "0.29.0"
directories = "6.0.0"
env_filter = "2"
indicatif = "0.18.6"
log = "0.4"
log4rs = { version = "1.4", default-features = false, features = [
    "compound_policy",
    "config_parsing",
    "console_appender",
    "fixed_window_roller",
    "pattern_encoder",
    "rolling_file_appender",
    "size_trigger",
    "yaml_format",
] }
pulldown-cmark = "0.13.4"
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
syntect = "5.3.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tantivy = "^0.26.0"
ratatui-textarea = "0.9"
tui-input = "0.15.3"
unicode-segmentation = "1.13.3"
unicode-truncate = "2.0.1"
unicode-width = "0.2.2"
url = "2.5"
boa_engine = { version = "0.21.0", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
boa_engine = { version = "0.21.0", default-features = false, features = ["jsvalue-enum"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6.1", optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.27"

[[bench]]
name = "render"
harness = false
