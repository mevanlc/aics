[package]
name = "aics"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
description = "Search local Claude Code, Codex CLI, and Antigravity chat session histories"
license = "MIT"
repository = "https://github.com/mevanlc/aics"
readme = "README.md"
keywords = ["cli", "tui", "search", "claude", "codex"]
categories = ["command-line-utilities", "text-processing"]
include = [
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/docs/**",
    "/examples/**",
    "/devdocs/RELEASING.md",
    "/devdocs/skills/aics-cli/SKILL.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "aics"
path = "src/main.rs"

[features]
default = ["arboard"]
termux = []
arboard = ["dep:arboard"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
crc32fast = "1.5"
crossterm = "0.29.0"
directories = "6.0.0"
indicatif = "0.18.6"
nucleo = "0.5"
pulldown-cmark = "0.13.6"
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
regex = "1.13"
renamest = "0.1.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
syntect = { version = "5.3.0", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tantivy = "0.27.0"
tantivy-fst = "0.5"
tempfile = "3.27"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui-textarea = "0.9"
tui-input = "0.15.3"
unicode-segmentation = "1.13.3"
unicode-truncate = "2.0.1"
unicode-width = "0.2.2"
url = "2.5"
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "0.14.3"
boa_engine = { version = "0.22.0", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
boa_engine = { version = "0.22.0", default-features = false, features = ["jsvalue-enum"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
criterion = "0.5"
log = "0.4"
test-log = { version = "0.2", default-features = false, features = ["trace"] }

[[bench]]
name = "render"
harness = false
