[package]
name = "aics"
version = "0.0.0"
edition = "2021"

[features]
default = ["arboard"]
termux = []
arboard = ["dep:arboard"]

[dependencies]
anyhow = "1.0"
ansi-to-tui = "7.0.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
env_logger = "0.11"
indicatif = "0.17.11"
log = "0.4"
pulldown-cmark = "0.13.4"
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
syntect = "5.3.0"
tantivy = "0.25.0"
ratatui-textarea = { package = "tui-textarea", version = "0.4.0" }
tui-input = "0.14.0"
unicode-segmentation = "1.13.3"
unicode-truncate = "2.0.1"
unicode-width = "0.2.0"

[patch.crates-io]
ratatui = { git = "https://github.com/nornagon/ratatui", rev = "9b2ad1298408c45918ee9f8241a6f95498cdbed2" }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6.1", optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.27"

[[bench]]
name = "render"
harness = false
