name: Bug report
description: Report a crash, incorrect behavior, or broken UI in aics
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the form below so we can reproduce and fix the issue.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of what the bug is.
      placeholder: "Searching for a term in Codex sessions panics with..."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the problem. Include any relevant query, keystrokes, or session files if possible.
      placeholder: |
        1. Run `aics`
        2. Type `...` into the search box
        3. Press Enter
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Paste any panic message, stack trace, or screenshot.
      placeholder: |
        ```
        thread 'main' panicked at ...
        ```
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: aics version
      description: Output of `aics --version` (or commit hash if built from source).
      placeholder: "aics 0.3.0"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Chat history source
      description: Which session source is affected?
      multiple: true
      options:
        - Claude Code
        - Codex CLI
        - Both
        - N/A
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - macOS
        - Linux
        - Windows
        - Termux / Android
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal emulator
      description: e.g. iTerm2, Alacritty, Windows Terminal, kitty, tmux version, etc.
      placeholder: "Alacritty 0.13 inside tmux 3.4"

  - type: input
    id: rust
    attributes:
      label: Rust toolchain (only if built from source)
      description: Output of `rustc --version`.
      placeholder: "rustc 1.82.0 (stable)"

  - type: input
    id: features
    attributes:
      label: Build features
      description: Non-default cargo features used (e.g. `termux`, `--no-default-features`).
      placeholder: "default"

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: For the TUI, run with `RUST_LOG=debug aics ...` and use the newest `~/.config/aics/logs/aics-<timestamp>-p<PID>.log`; command/JSON invocations log to stderr with the built-in configuration. Redact local paths, commands, and anything else sensitive. If `AICS_CONFIG_ROOT` is set, look under that directory instead.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help — related issues, recent changes, unusual session files, etc.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce this on the latest release or `main`.
          required: false
